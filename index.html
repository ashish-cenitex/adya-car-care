<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#0B2A4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Adya Car Care">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">

<title>Adya Car Care</title>

<style>
:root{
  --navy:#0B2A4A;
  --navy2:#123E69;
  --blue:#1976D2;
  --blue2:#2E8DE6;
  --red:#D62828;
  --red2:#EF3E36;

  --bg:#EEF3F8;
  --surface:#FFFFFF;
  --surface2:#F7F9FC;
  --border:#D8E1EA;

  --text:#17212B;
  --muted:#657483;

  --good:#238B57;
  --goodbg:#E9F7EF;

  --warn:#D68A00;
  --warnbg:#FFF6DD;

  --danger:#C62A2A;
  --dangerbg:#FDECEC;

  --shadow:0 3px 12px rgba(22,45,70,.08);
  --shadow2:0 8px 24px rgba(10,42,74,.14);

  --radius:14px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  min-height:100%;
}

body{
  margin:0;

  background:
    linear-gradient(
      180deg,
      #E7EEF6 0,
      #F4F7FA 240px,
      var(--bg) 100%
    );

  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  -webkit-font-smoothing:antialiased;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

#app{
  max-width:680px;
  margin:auto;

  min-height:100vh;

  padding-bottom:
    calc(
      92px +
      env(safe-area-inset-bottom)
    );
}


/* HEADER */

.topbar{
  position:sticky;
  top:0;

  z-index:30;

  background:
    linear-gradient(
      135deg,
      var(--navy),
      var(--navy2)
    );

  color:white;

  padding:
    calc(
      14px +
      env(safe-area-inset-top)
    )
    16px
    13px;

  box-shadow:
    0 4px 14px
    rgba(0,0,0,.14);
}

.brand{
  display:flex;

  justify-content:space-between;
  align-items:flex-start;

  gap:10px;
}

.brand-title{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:42px;
  height:42px;

  border-radius:12px;

  background:
    linear-gradient(
      145deg,
      var(--red2),
      var(--red)
    );

  display:flex;
  align-items:center;
  justify-content:center;

  font-weight:900;

  box-shadow:
    inset 0 0 0 1px
    rgba(255,255,255,.15);
}

.brand h1{
  margin:0;
  font-size:21px;
}

.sub{
  font-size:11.5px;

  color:
    rgba(255,255,255,.76);

  margin-top:3px;
}

.status{
  font-size:10px;
  font-weight:700;

  padding:6px 8px;

  border-radius:20px;

  background:
    rgba(255,255,255,.12);

  border:
    1px solid
    rgba(255,255,255,.18);

  white-space:nowrap;
}

.status.good{
  color:#D7FFE5;
}

.back{
  background:none;
  border:0;

  color:
    rgba(255,255,255,.85);

  padding:0 0 10px;

  font-size:13px;
  font-weight:700;
}


/* HERO */

.hero{
  background:
    linear-gradient(
      120deg,
      var(--navy),
      #174E82 68%,
      var(--blue)
    );

  color:white;

  padding:
    22px 16px
    30px;
}

.hero .eyebrow{
  font-size:11px;
  font-weight:800;

  text-transform:uppercase;
  letter-spacing:.1em;

  color:
    rgba(255,255,255,.68);
}

.hero h2{
  margin:5px 0 0;

  font-size:23px;
  line-height:1.18;
}

.hero p{
  margin:7px 0 0;

  color:
    rgba(255,255,255,.8);

  font-size:12.5px;

  line-height:1.5;
}


/* SEARCH */

.search-panel{
  margin:
    -17px 16px
    14px;

  position:relative;
  z-index:4;
}

.search-wrap{
  background:white;

  border-radius:14px;

  padding:5px;

  box-shadow:var(--shadow2);
}

.search-input{
  width:100%;

  border:0;
  outline:0;

  padding:
    13px 14px;

  border-radius:10px;

  font-size:15px;

  color:var(--text);
}


/* MAIN */

main{
  padding:
    14px 16px
    28px;
}

.page-title{
  margin:0;

  color:var(--navy);

  font-size:22px;
  font-weight:850;
}

.page-sub{
  margin-top:3px;

  color:var(--muted);

  font-size:12px;
}

.page-title-row{
  display:flex;

  justify-content:space-between;
  align-items:flex-end;

  gap:10px;

  margin-bottom:14px;
}

.count{
  border-radius:20px;

  background:#DFEBF8;

  color:var(--navy);

  padding:
    6px 10px;

  font-size:11px;
  font-weight:800;
}


/* STATS */

.stats{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:9px;

  margin-bottom:18px;
}

.stat{
  background:white;

  border:
    1px solid
    var(--border);

  border-radius:14px;

  padding:12px;

  box-shadow:var(--shadow);
}

.stat:nth-child(1){
  border-top:
    4px solid
    var(--blue);
}

.stat:nth-child(2){
  border-top:
    4px solid
    var(--red);
}

.stat:nth-child(3){
  border-top:
    4px solid
    #25A36F;
}

.stat .n{
  color:var(--navy);

  font-size:24px;
  font-weight:850;
}

.stat .l{
  color:var(--muted);

  font-size:10.5px;
}


/* QUICK BUTTONS */

.quick{
  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:10px;

  margin-bottom:18px;
}

.quick button{
  background:white;

  color:var(--navy);

  border:
    1px solid
    var(--border);

  border-radius:14px;

  padding:15px;

  text-align:left;

  font-weight:800;

  box-shadow:var(--shadow);
}

.quick .qsub{
  display:block;

  margin-top:4px;

  color:var(--muted);

  font-size:11px;
  font-weight:500;

  line-height:1.35;
}


/* CARDS */

.section{
  color:#718090;

  font-size:11.5px;
  font-weight:850;

  text-transform:uppercase;

  letter-spacing:.05em;

  margin:
    20px 0
    9px;

  display:flex;

  justify-content:space-between;
  align-items:center;
}

.card,
.record,
.detail,
.panel{
  background:white;

  border:
    1px solid
    var(--border);

  border-radius:
    var(--radius);

  box-shadow:
    var(--shadow);
}

.card{
  padding:
    13px 14px;

  margin-bottom:10px;
}

.card.accent{
  border-left:
    4px solid
    var(--blue);
}

.row{
  display:flex;

  justify-content:space-between;
  align-items:center;

  gap:10px;
}

.name{
  color:var(--navy);

  font-weight:800;

  font-size:15px;
}

.meta{
  color:var(--muted);

  font-size:12.5px;

  margin-top:3px;
}


/* PLATE */

.plate{
  background:#FAFAF7;

  color:var(--text);

  border:
    1.5px solid
    #D4D2C9;

  border-radius:6px;

  padding:
    5px 9px
    4px;

  font:
    850 13px
    "Courier New",
    monospace;

  letter-spacing:.08em;

  display:inline-flex;

  flex-direction:column;
  align-items:center;
}

.plate .vic{
  font-size:6px;

  color:#124F91;

  margin-top:2px;
}

.plate.lg{
  font-size:20px;

  padding:
    8px 16px
    6px;
}

.plate-row{
  display:flex;

  gap:6px;

  flex-wrap:wrap;

  margin-top:9px;
}


/* BUTTONS */

.btn{
  width:100%;

  display:inline-flex;

  justify-content:center;
  align-items:center;

  gap:6px;

  border:0;

  border-radius:11px;

  padding:
    12px 16px;

  background:
    linear-gradient(
      135deg,
      var(--blue),
      var(--blue2)
    );

  color:white;

  font-size:14px;
  font-weight:800;
}

.btn.red{
  background:
    linear-gradient(
      135deg,
      var(--red2),
      var(--red)
    );
}

.btn.secondary{
  background:white;

  color:var(--navy);

  border:
    1px solid
    var(--border);
}

.btn.danger{
  background:
    var(--dangerbg);

  color:
    var(--danger);

  border:
    1px solid
    #F4C5C5;
}

.btn-row{
  display:flex;

  gap:8px;

  margin-top:14px;
}

.btn-row .btn{
  flex:1;
}


/* FLOATING ADD */

.fab{
  position:fixed;

  right:
    max(
      20px,
      calc(
        (100vw - 680px)/2
        + 20px
      )
    );

  bottom:
    calc(
      78px +
      env(safe-area-inset-bottom)
    );

  z-index:35;

  width:58px;
  height:58px;

  border-radius:50%;

  border:0;

  background:
    linear-gradient(
      145deg,
      var(--red2),
      var(--red)
    );

  color:white;

  font-size:30px;
  font-weight:800;

  box-shadow:
    0 8px 20px
    rgba(198,42,42,.3);
}


/* BOTTOM TABS */

.tabbar{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:32;

  background:
    rgba(255,255,255,.98);

  border-top:
    1px solid
    var(--border);

  padding-bottom:
    env(safe-area-inset-bottom);

  box-shadow:
    0 -4px 16px
    rgba(17,42,67,.08);
}

.tabs{
  max-width:680px;

  margin:auto;

  display:grid;

  grid-template-columns:
    repeat(4,1fr);
}

.tab{
  border:0;
  background:none;

  color:#738292;

  padding:
    9px 2px
    8px;

  font-size:10px;
  font-weight:800;

  display:flex;

  flex-direction:column;
  align-items:center;

  gap:2px;
}

.tab .ic{
  font-size:18px;
}

.tab.active{
  color:var(--blue);
}

.tab.active.redactive{
  color:var(--red);
}


/* DETAILS */

.detail{
  padding:16px;

  margin-bottom:16px;

  border-top:
    4px solid
    var(--blue);
}

.detail h2{
  margin:
    0 0 4px;

  color:var(--navy);

  font-size:20px;
}

.chips{
  display:flex;

  gap:6px;

  flex-wrap:wrap;

  margin-top:10px;
}

.chip{
  background:#EDF4FB;

  border:
    1px solid
    #D5E6F6;

  color:var(--navy);

  border-radius:20px;

  padding:
    6px 11px;

  font-size:12px;
}

.chip a{
  text-decoration:none;
}


/* VEHICLES */

.vehicle{
  background:white;

  border:
    1px solid
    var(--border);

  border-left:
    4px solid
    var(--red);

  border-radius:
    var(--radius);

  padding:14px;

  margin-bottom:10px;

  box-shadow:var(--shadow);
}

.vinfo{
  color:var(--muted);

  font-size:13px;

  margin-top:8px;
}

.vinfo b{
  color:var(--navy);
}


/* RECORDS */

.record{
  padding:14px;

  margin-bottom:11px;

  border-left:
    4px solid
    var(--blue);
}

.record-top{
  display:flex;

  justify-content:space-between;

  gap:10px;
}

.rdate{
  color:var(--navy);

  font-size:14px;
  font-weight:850;
}

.rtype{
  color:var(--muted);

  font-size:12.5px;

  margin-top:3px;
}

.badge{
  font-size:10px;
  font-weight:850;

  padding:
    4px 9px;

  border-radius:20px;

  text-transform:uppercase;
}

.paid{
  background:var(--goodbg);
  color:var(--good);
}

.partial{
  background:var(--warnbg);
  color:var(--warn);
}

.unpaid{
  background:var(--dangerbg);
  color:var(--danger);
}

.label{
  color:var(--muted);

  font-size:10.5px;
  font-weight:800;

  text-transform:uppercase;

  letter-spacing:.04em;

  margin:
    8px 0
    2px;
}

.pending{
  background:
    var(--warnbg);

  border:
    1px solid
    #F1D697;

  border-radius:10px;

  padding:
    9px 11px;

  margin-top:10px;

  font-size:13px;
}

.actions{
  display:flex;

  gap:15px;

  margin-top:11px;
}

.actions button{
  border:0;

  background:none;

  padding:0;

  color:var(--blue);

  font-size:12px;
  font-weight:800;
}

.actions .del{
  color:var(--danger);
}


/* FORMS */

form{
  display:flex;

  flex-direction:column;

  gap:14px;
}

.field label{
  display:block;

  color:#5C6D7D;

  font-size:12px;
  font-weight:800;

  margin-bottom:6px;
}

.field input,
.field select,
.field textarea{
  width:100%;

  padding:12px;

  border-radius:10px;

  border:
    1px solid
    var(--border);

  background:white;

  color:var(--text);

  outline:0;

  font-size:14px;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:
    var(--blue);

  box-shadow:
    0 0 0 3px
    rgba(25,118,210,.1);
}

.field textarea{
  min-height:75px;

  resize:vertical;
}

.two{
  display:flex;
  gap:10px;
}

.two > .field{
  flex:1;
}

.multi{
  display:flex;

  gap:8px;

  margin-bottom:8px;
}

.multi input{
  flex:1;
}

.iconbtn{
  width:42px;

  border:
    1px solid
    var(--border);

  border-radius:9px;

  background:white;

  color:var(--danger);

  font-size:18px;
}

.addlink{
  width:100%;

  padding:9px;

  border:
    1px dashed
    #A8BDD1;

  background:#F8FBFE;

  color:var(--blue);

  border-radius:9px;

  font-size:12px;
  font-weight:800;
}

.divider{
  height:1px;

  background:var(--border);

  margin:7px 0;
}

.fieldset{
  color:var(--navy);

  font-size:12px;
  font-weight:900;

  text-transform:uppercase;

  letter-spacing:.05em;
}

.hint{
  color:var(--muted);

  font-size:11px;

  margin-top:-7px;
}


/* DATA / BACKUP */

.panel{
  padding:16px;

  margin-bottom:14px;
}

.panel h3{
  margin:
    0 0 6px;

  color:var(--navy);

  font-size:15px;
}

.panel p{
  margin:
    0 0 12px;

  color:var(--muted);

  font-size:12.5px;

  line-height:1.55;
}

.notice{
  padding:12px;

  background:#EAF3FC;

  border:
    1px solid
    #C8E0F7;

  border-left:
    4px solid
    var(--blue);

  border-radius:11px;

  font-size:12.5px;

  line-height:1.5;

  margin-bottom:14px;
}

.notice.warn{
  background:
    var(--warnbg);

  border-color:#F0D49B;

  border-left-color:
    var(--warn);
}


/* PHOTOS */

.photos{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:8px;

  margin-top:10px;
}

.photo{
  position:relative;

  aspect-ratio:1;

  background:#E9EEF3;

  border:
    1px solid
    var(--border);

  border-radius:10px;

  overflow:hidden;
}

.photo img{
  width:100%;
  height:100%;

  object-fit:cover;
}

.photo .x{
  position:absolute;

  top:5px;
  right:5px;

  width:29px;
  height:29px;

  border-radius:50%;

  border:0;

  background:
    rgba(20,25,30,.78);

  color:white;

  font-size:18px;
}


/* EMPTY */

.empty{
  text-align:center;

  padding:
    42px 20px;

  color:var(--muted);
}

.empty .big{
  color:var(--navy);

  font-weight:800;

  margin-bottom:6px;
}

.empty-icon{
  width:56px;
  height:56px;

  margin:
    0 auto
    10px;

  border-radius:50%;

  background:#E4EDF6;

  color:var(--blue);

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:24px;
}


/* PHOTO MODAL */

.modal{
  position:fixed;

  inset:0;

  z-index:100;

  background:
    rgba(5,20,34,.94);

  display:flex;

  align-items:center;
  justify-content:center;

  padding:20px;
}

.modal img{
  max-width:100%;
  max-height:85vh;

  border-radius:12px;
}

.modal-close{
  position:absolute;

  top:
    calc(
      18px +
      env(safe-area-inset-top)
    );

  right:18px;

  width:42px;
  height:42px;

  border-radius:50%;

  border:0;

  background:white;

  color:var(--navy);

  font-size:23px;
}


/* TOAST */

.toast{
  position:fixed;

  left:50%;

  bottom:
    calc(
      92px +
      env(safe-area-inset-bottom)
    );

  transform:
    translateX(-50%);

  z-index:80;

  background:var(--navy);

  color:white;

  padding:
    10px 15px;

  border-radius:20px;

  font-size:12.5px;

  opacity:0;

  pointer-events:none;

  box-shadow:var(--shadow2);
}

.toast.show{
  opacity:1;
}

#importFile,
#photoInput{
  display:none;
}

@media(max-width:430px){

  .two{
    flex-direction:column;
  }

  .stats{
    gap:7px;
  }

  .stat{
    padding:10px;
  }

  .stat .n{
    font-size:21px;
  }

  .btn-row{
    flex-direction:column;
  }

  .photos{
    grid-template-columns:
      repeat(2,1fr);
  }
}
</style>
</head>

<body>

<div id="app"></div>

<div
  id="toast"
  class="toast"
></div>

<input
  id="importFile"
  type="file"
  accept="application/json,.json"
>

<input
  id="photoInput"
  type="file"
  accept="image/*"
  multiple
>


<script>
"use strict";


/* ============================================================
   ADYA CAR CARE iPHONE DATABASE

   The WORKING database is stored in IndexedDB on the iPhone.

   Customers
   Vehicles
   Jobs
   Photos
   Settings

   Manual backup converts everything, including photos,
   into one JSON file that can be sent to Google Drive.
============================================================ */

const DB_NAME =
  "adyaCarCareDB";

const DB_VERSION =
  1;

let db = null;


let state = {
  view:"home",
  params:{}
};


const app =
  document.getElementById(
    "app"
  );


const SERVICE_TYPES = [

  "Oil change",

  "Full service",

  "Logbook service",

  "Brake service",

  "Tyre replacement",

  "Wheel alignment",

  "Wheel balancing",

  "Battery replacement",

  "Air conditioning service",

  "Roadworthy certificate (RWC)",

  "Diagnostic check",

  "Suspension work",

  "Steering repair",

  "Engine repair",

  "Transmission service",

  "Cooling system",

  "Electrical repair",

  "Timing belt / chain",

  "Pre-purchase inspection",

  "Other"
];


/* ============================================================
   HELPERS
============================================================ */

function uid(){

  if(
    window.crypto &&
    crypto.randomUUID
  ){
    return crypto.randomUUID();
  }

  return (
    "id-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(16)
      .slice(2)
  );
}


function esc(v){

  if(
    v === undefined ||
    v === null
  ){
    return "";
  }

  return String(v)
    .replace(
      /[&<>"']/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      })[c]
    );
}


function todayStr(){

  const d =
    new Date();

  return (

    d.getFullYear() +
    "-" +

    String(
      d.getMonth()+1
    ).padStart(
      2,
      "0"
    ) +

    "-" +

    String(
      d.getDate()
    ).padStart(
      2,
      "0"
    )
  );
}


function fmtDate(value){

  if(!value){
    return "";
  }

  const date =
    new Date(
      value +
      "T00:00:00"
    );

  if(
    Number.isNaN(
      date.getTime()
    )
  ){
    return value;
  }

  return date
    .toLocaleDateString(
      "en-AU",
      {
        day:"2-digit",
        month:"short",
        year:"numeric"
      }
    );
}


function fmtDateTime(value){

  if(!value){
    return "Never";
  }

  return new Date(value)
    .toLocaleString(
      "en-AU",
      {
        day:"2-digit",
        month:"short",
        year:"numeric",
        hour:"numeric",
        minute:"2-digit"
      }
    );
}


function toast(message){

  const el =
    document.getElementById(
      "toast"
    );

  el.textContent =
    message;

  el.classList.add(
    "show"
  );

  clearTimeout(
    toast.timer
  );

  toast.timer =
    setTimeout(
      () =>
        el.classList
          .remove(
            "show"
          ),
      1900
    );
}

/* ============================================================
   INDEXEDDB
============================================================ */

function openDB(){

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const request =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );


      request.onupgradeneeded =
        event => {

          const database =
            event.target.result;


          if(
            !database.objectStoreNames
              .contains(
                "customers"
              )
          ){

            database
              .createObjectStore(
                "customers",
                {
                  keyPath:"id"
                }
              );
          }


          if(
            !database.objectStoreNames
              .contains(
                "vehicles"
              )
          ){

            database
              .createObjectStore(
                "vehicles",
                {
                  keyPath:"id"
                }
              );
          }


          if(
            !database.objectStoreNames
              .contains(
                "records"
              )
          ){

            database
              .createObjectStore(
                "records",
                {
                  keyPath:"id"
                }
              );
          }


          if(
            !database.objectStoreNames
              .contains(
                "photos"
              )
          ){

            database
              .createObjectStore(
                "photos",
                {
                  keyPath:"id"
                }
              );
          }


          if(
            !database.objectStoreNames
              .contains(
                "settings"
              )
          ){

            database
              .createObjectStore(
                "settings",
                {
                  keyPath:"key"
                }
              );
          }
        };


      request.onsuccess =
        event => {

          db =
            event.target.result;

          resolve(db);
        };


      request.onerror =
        () => {

          reject(
            request.error
          );
        };
    }
  );
}


function getStore(
  name,
  mode="readonly"
){

  return db
    .transaction(
      name,
      mode
    )
    .objectStore(
      name
    );
}


function getAll(
  name
){

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const request =
        getStore(name)
          .getAll();

      request.onsuccess =
        () =>
          resolve(
            request.result ||
            []
          );

      request.onerror =
        () =>
          reject(
            request.error
          );
    }
  );
}


function getOne(
  name,
  id
){

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const request =
        getStore(name)
          .get(id);

      request.onsuccess =
        () =>
          resolve(
            request.result ||
            null
          );

      request.onerror =
        () =>
          reject(
            request.error
          );
    }
  );
}


function saveOne(

    (
      resolve,
      reject
    ) => {

      const request =
        getStore(
          name,
          "readwrite"
        )
        .put(
          object
        );

      request.onsuccess =
        () =>
          resolve(
            object
          );

      request.onerror =
        () =>
          reject(
            request.error
          );
    }
  );
}

  const customer =

        record.customerId

  const statusClass =

      "Partial"

    ? "partial"

    : "unpaid";


  return `

    <div
      class="record"
      data-job-search="${esc(
        [
          customer?.name,
          vehicle?.rego,
          vehicle?.make,
          vehicle?.model,
          record.serviceType,

      <div
        class="row"
        style="
          margin-top:10px;
          align-items:flex-start;
        "
      >

        <div>

          <div
            class="name"
            style="font-size:14px"
          >

            ${esc(
              customer?.name ||
              "Unknown customer"
            )}

          </div>

          <div class="meta">

            ${esc(
              [
                vehicle?.year,
                vehicle?.make,
                vehicle?.model
              ]
              .filter(Boolean)
              .join(" ")
            )}

          </div>

        </div>


        ${
          vehicle

          ? `

            <div class="plate">

              ${esc(
                vehicle.rego
              )}

              <span class="vic">
                VIC
              </span>

            </div>

          `

          : ""

      </div>


      ${

async function viewVehicle(id){

  const vehicle =
    await vehicleById(id);


  if(!vehicle){
    return "";
  }


  const customer =
    await customerById(
      vehicle.customerId
    );


  const records =
    (
      await getAll(
        "records"
      )
    )
    .filter(
      r =>
        r.vehicleId ===
        id
    )
    .sort(
      (a,b) =>
        String(
          b.date ||
          ""
        )
        .localeCompare(
          String(
            a.date ||
            ""
          )
        )
    );


  let history = "";


  for(
    const record of records
  ){

    history +=
      await recordCard(
        record
      );
  }


  return `

    ${header({
      view:"customer",
      params:{
        id:
          vehicle.customerId
      },
      label:
        customer?.name ||
        "Customer"
    })}


    <main>

      <div class="detail">

        <div class="row">

          <div class="plate lg">

            ${esc(
              vehicle.rego
            )}

            <span class="vic">
              VIC
            </span>

          </div>


          <div class="meta">

            ${esc(
              customer?.name ||
              ""
            )}

          </div>

        </div>


        <div
          class="vinfo"
          style="margin-top:12px"
        >

          <b>

            ${esc(
              [
                vehicle.year,
                vehicle.make,
                vehicle.model
              ]
              .filter(Boolean)
              .join(" ")
            )}

          </b>


          ${
            vehicle.color
            ? " · " +
              esc(
                vehicle.color
              )
            : ""
          }

        </div>


        ${
          vehicle.vin
          ? `
            <div class="label">
              VIN / Chassis
            </div>

            ${esc(
              vehicle.vin
            )}
          `
          : ""
        }


        ${
          vehicle.odometer
          ? `
            <div class="label">
              Last known odometer
            </div>

            ${esc(
              vehicle.odometer
            )} km
          `
          : ""
        }


        ${
          vehicle.notes
          ? `
            <div class="label">
              Notes
            </div>

            ${esc(
              vehicle.notes
            )}
          `
          : ""
        }


        <div class="section">
          Vehicle photos
        </div>


        ${await photoGrid(
          "vehicle",
          vehicle.id,
          false
        )}


        <div class="btn-row">

          <button
            class="btn secondary"
            data-action="edit-vehicle"
            data-id="${vehicle.id}"
          >
            Edit Vehicle
          </button>

          <button
            class="btn danger"
            data-action="delete-vehicle"
            data-id="${vehicle.id}"
          >
            Delete
          </button>

        </div>

      </div>


      <button
        class="btn red"
        data-action="add-record"
        data-id="${vehicle.id}"
      >
        + New Service Visit
      </button>


      <div class="section">

        Service history

        <span>
          ${records.length}
        </span>

      </div>


      ${
        history

        ||

        `<div class="empty">
           <div class="big">
             No service visits yet
           </div>
         </div>`
      }

    </main>


    ${tabs("")}
  `;
}


/* ============================================================
   SERVICE CARD
============================================================ */

async function recordCard(record){

  const statusClass =

    record.paymentStatus ===
    "Paid in full"

    ? "paid"

    : record.paymentStatus ===
      "Partial"

    ? "partial"

    : "unpaid";


  return `

    <div class="record">

      <div class="record-top">

        <div>

          <div class="rdate">

            ${fmtDate(
              record.date
            )}

          </div>

          <div class="rtype">

            ${esc(
              record.serviceType ||
              "Service"
            )}

          </div>

        </div>


        ${
          record.paymentStatus

          ? `

            <span
              class="badge ${statusClass}"
            >

              ${esc(
                record.paymentStatus
              )}

            </span>

          `

          : ""
        }

      </div>


      ${
        record.quoteDetails

        ? `
          <div class="label">
            Quote
          </div>

          ${esc(
            record.quoteDetails
          )}

          ${
            record.quoteAmount
            ? " — $" +
              esc(
                record.quoteAmount
              )
            : ""
          }
        `

        : ""
      }


      ${
        record.workDone

        ? `
          <div class="label">
            Work completed
          </div>

          ${esc(
            record.workDone
          )}

          ${
            record.amountPaid
            ? " — $" +
              esc(
                record.amountPaid
              )
            : ""
          }
        `

        : ""
      }


      ${
        record.odometerAtVisit

        ? `
          <div class="label">
            Odometer
          </div>

          ${esc(
            record.odometerAtVisit
          )} km
        `

        : ""
      }


      ${
        record.invoiceNumber

        ? `
          <div class="label">
            Invoice / Job #
          </div>

          ${esc(
            record.invoiceNumber
          )}
        `

        : ""
      }


      ${
        record.pendingWork

        ? `
          <div class="pending">

            <b>
              Pending:
            </b>

            ${esc(
              record.pendingWork
            )}

          </div>
        `

        : ""
      }


      ${
        (
          await ownerPhotos(
            "record",
            record.id
          )
        ).length

        ? `

          <div class="section">
            Photos
          </div>

          ${await photoGrid(
            "record",
            record.id,
            false
          )}

        `

        : ""
      }


      <div class="actions">

        <button
          data-action="edit-record"
          data-id="${record.id}"
          data-vid="${record.vehicleId}"
        >
          Edit
        </button>


        <button
          class="del"
          data-action="delete-record"
          data-id="${record.id}"
        >
          Delete
        </button>

      </div>

    </div>
  `;
}

/* ============================================================
   PHOTOS
============================================================ */

async function ownerPhotos(
  ownerType,
  ownerId
){

  return (
    await getAll(
      "photos"
    )
  )
  .filter(
    photo =>
      photo.ownerType ===
      ownerType

      &&

      photo.ownerId ===
      ownerId
  );
}


async function photoGrid(
  ownerType,
  ownerId,
  editable=false
){

  const photos =
    await ownerPhotos(
      ownerType,
      ownerId
    );


  if(!photos.length){

    return `
      <div class="meta">
        No photos saved.
      </div>
    `;
  }


  let output = "";


  for(
    const photo of photos
  ){

    const url =
      URL.createObjectURL(
        photo.blob
      );


    output += `

      <div class="photo">

        <img
          src="${url}"
          data-action="view-photo"
        >

        ${
          editable

          ? `

            <button
              type="button"
              class="x"
              data-action="delete-photo"
              data-photo-id="${photo.id}"
            >
              ×
            </button>

          `

          : ""
        }

      </div>
    `;
  }


  return `
    <div class="photos">
      ${output}
    </div>
  `;
}


function photoButtons(
  ownerType,
  ownerId
){

  return `

    <div class="btn-row">

      <button
        type="button"

function compressImage(
  file,
  maxSide=1600,
  quality=.82
){

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const img =
        new Image();


      const url =
        URL.createObjectURL(
          file
        );


      img.onload =
        () => {

          let width =
            img.naturalWidth;

          let height =
            img.naturalHeight;


          const scale =
            Math.min(
              1,
              maxSide /
              Math.max(
                width,
                height
              )
            );


          width =
            Math.round(
              width * scale
            );

          height =
            Math.round(
              height * scale
            );


          const canvas =
            document.createElement(
              "canvas"
            );


          canvas.width =
            width;

          canvas.height =
            height;


          canvas
            .getContext(
              "2d"
            )
            .drawImage(
              img,
              0,
              0,
              width,
              height
            );


          canvas.toBlob(
            blob => {

              URL.revokeObjectURL(
                url
              );

              if(blob){

                resolve(blob);

              }else{

                reject(
                  new Error(
                    "Image compression failed."
                  )
                );
              }
            },

            "image/jpeg",

            quality
          );
        };


      img.onerror =
        () => {

          reject(
            new Error(
              "Could not read image."
            )
          );
        };


      img.src =
        url;
    }
  );
}


async function savePhotos(
  files,
  ownerType,
  ownerId
){

  for(
    const file of files
  ){

    if(
      !file.type.startsWith(
        "image/"
      )
    ){
      continue;

    toast(

      await compressImage(

    await saveOne(

        ownerId,

        blob,

        createdAt:
          Date.now()
      }
    );

  toast(
    "Photo saved"
  );


  render();
}

function blobToDataURL(blob){

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const reader =
        new FileReader();


      reader.onload =
        () =>
          resolve(
            reader.result
          );


      reader.onerror =
        () =>
          reject(
            reader.error
          );


      reader.readAsDataURL(
        blob
      );
    }
  );
}


async function dataURLToBlob(
  dataURL
){

  const [
    header,
    base64
  ] =
    dataURL.split(",");


  const mime =
    (
      header.match(
        /data:(.*?);base64/
      )
      ||
      []
    )[1]
    ||
    "image/jpeg";


  const bytes =
    Uint8Array.from(
      atob(base64),
      c =>
        c.charCodeAt(0)
    );


  return new Blob(
    [bytes],
    {
      type:mime
    }
  );
}


async function makeBackup(){

  toast(
    "Preparing backup..."
  );


  const [
    customers,
    vehicles,
    records,
    photos
  ] =
    await Promise.all([
      getAll("customers"),
      getAll("vehicles"),
      getAll("records"),
      getAll("photos")
    ]);


  const exportedPhotos =
    [];


  for(
    const photo of photos
  ){

    exportedPhotos.push({

      id:
        photo.id,

      ownerType:
        photo.ownerType,

      ownerId:
        photo.ownerId,

      createdAt:
        photo.createdAt,

      data:
        await blobToDataURL(
          photo.blob
        )
    });
  }


  const payload = {

    app:
      "adya-car-care",

    version:
      1,

    exportedAt:
      new Date()
        .toISOString(),

    customers,

    vehicles,

    records,

    photos:
      exportedPhotos
  };


  const file =
    new File(
      [
        JSON.stringify(
          payload
        )
      ],
      `Adya-Car-Care-Backup-${todayStr()}.json`,
      {
        type:
          "application/json"
      }
    );


  try{

    if(
      navigator.canShare &&
      navigator.canShare({
        files:[file]
      })
    ){

      await navigator.share({

        title:
          "Adya Car Care Backup",

        text:
          "Save this backup to Google Drive.",

        files:[
          file
        ]
      });

    }else{

      downloadBackup(
        file
      );
    }


    await setSetting(
      "lastBackup",
      new Date()
        .toISOString()
    );


    toast(
      "Backup created"
    );

  }catch(error){

    if(
      error.name !==
      "AbortError"
    ){

      downloadBackup(
        file
      );
    }
  }
}


function downloadBackup(
  file
){

  const url =
    URL.createObjectURL(
      file
    );


  const link =
    document.createElement(
      "a"
    );


  link.href =
    url;


  link.download =
    file.name;


  document.body
    .appendChild(
      link
    );


  link.click();


  link.remove();


  setTimeout(
    () =>
      URL.revokeObjectURL(
        url
      ),
    1000
  );
}


/* ============================================================
   RESTORE
============================================================ */

async function restoreBackup(
  file
){

  try{

    const data =
      JSON.parse(
        await file.text()
      );


    if(
      !Array.isArray(
        data.customers
      )

      ||

      !Array.isArray(
        data.vehicles
      )

      ||

      !Array.isArray(
        data.records
      )

      ||

      !Array.isArray(
        data.photos
      )
    ){

      throw new Error(
        "Invalid Adya Car Care backup."
      );
    }


    if(
      !confirm(

        "Restore this backup?\n\nThis replaces the local database currently stored on this iPhone."
      )
    ){

      return;
    }


    await clearStore(
      "customers"
    );

    await clearStore(
      "vehicles"
    );

    await clearStore(
      "records"
    );

    await clearStore(
      "photos"
    );


    for(
      const customer of
      data.customers
    ){

      await saveOne(
        "customers",
        customer
      );
    }


    for(
      const vehicle of
      data.vehicles
    ){

      await saveOne(
        "vehicles",
        vehicle
      );
    }


    for(
      const record of
      data.records
    ){

      await saveOne(
        "records",
        record
      );
    }


    for(
      const photo of
      data.photos
    ){

      await saveOne(
        "photos",
        {

          id:
            photo.id,

          ownerType:
            photo.ownerType,

          ownerId:
            photo.ownerId,

          createdAt:
            photo.createdAt,

          blob:
            await dataURLToBlob(
              photo.data
            )
        }
      );
    }


    toast(
      "Backup restored"
    );


    go(
      "home"
    );

  }catch(error){

    alert(

      "Could not restore backup.\n\n"

      +

      (
        error.message ||
        error
      )
    );
  }
}

      "homeSearch"

        const q =
          event.target.value
            .trim()
            .toLowerCase();


        const cards =
          app.querySelectorAll(
            ".card"
          );


        if(!q){

          cards.forEach(
            card =>
              card.style.display =
                ""
          );

          return;
        }


        const [
          customers,
          vehicles
        ] =
          await Promise.all([
            getAll("customers"),
            getAll("vehicles")
          ]);


        const compact =
          q.replace(
            /\s/g,
            ""
          );


        const ids =
          new Set();


        customers.forEach(
          customer => {

            if(

              (
                customer.name ||
                ""
              )
              .toLowerCase()
              .includes(q)

              ||

              (
                customer.phones ||
                []
              )
              .some(
                p =>
                  String(p)
                    .replace(
                      /\s/g,
                      ""
                    )
                    .includes(
                      compact
                    )
              )
            ){

              ids.add(

              .includes(

      action === "new-customer"
    ){

      go(
        "customerForm"
      );

    }else if(
      action === "open-customer"
    ){

      go(
        "customer",
        {
          id:
            el.dataset.id
        }
      );

    }else if(
      action === "open-vehicle"
    ){

      go(
        "vehicle",
        {
          id:
            el.dataset.id
        }
      );

    }else if(
      action === "edit-customer"
    ){

      go(
        "customerForm",
        {
          id:
            el.dataset.id
        }
      );

    }else if(
      action === "add-vehicle"
    ){

      go(
        "vehicleForm",
        {
          customerId:
            el.dataset.id
        }
      );

    }else if(
      action === "edit-vehicle"
    ){

      go(
        "vehicleForm",
        {
          id:
            el.dataset.id
        }
      );

    }else if(
      action === "add-record"
    ){

      go(
        "recordForm",
        {
          vehicleId:
            el.dataset.id
        }
      );

    }else if(
      action === "edit-record"
    ){

      go(
        "recordForm",
        {
          id:
            el.dataset.id,
          vehicleId:
            el.dataset.vid
        }
      );

    }else if(
      action === "remove-phone-row"
    ){

      el.closest(
        ".multi"
      )?.remove();

    }else if(
      action === "take-photo"
      ||
      action === "choose-photo"
    ){

      photoTarget = {

        ownerType:
          el.dataset.ownerType,

        ownerId:
          el.dataset.ownerId
      };


      const input =
        document.getElementById(
          "photoInput"
        );


      if(
        action ===
        "take-photo"
      ){

        input.setAttribute(
          "capture",
          "environment"
        );

      }else{

        input.removeAttribute(
          "capture"
        );
      }


      input.click();

    }else if(
      action === "delete-photo"
    ){

      if(
        confirm(
          "Delete this photo?"
        )
      ){

        await deleteOne(
          "photos",
          el.dataset.photoId
        );


        render();
      }

    }else if(
      action === "view-photo"
    ){

      const modal =
        document.createElement(
          "div"
        );


      modal.className =
        "modal";


      modal.innerHTML = `

        <button
          class="modal-close"
        >
          ×
        </button>

        <img
          src="${el.getAttribute("src")}"
        >
      `;


      modal.addEventListener(
        "click",
        e => {

          if(
            e.target === modal

            ||

            e.target
              .classList
              .contains(
                "modal-close"
              )
          ){

            modal.remove();
          }
        }
      );


      document.body
        .appendChild(
          modal
        );

    }else if(
      action === "backup"
    ){

      await makeBackup();

    }else if(
      action === "restore"
    ){

      document
        .getElementById(
          "importFile"
        )
        .click();

    }else if(
      action === "erase-local"
    ){

      await eraseLocalData();

    }else if(
      action === "delete-customer"
    ){

      await deleteCustomer(
        el.dataset.id
      );

    }else if(
      action === "delete-vehicle"
    ){

      await deleteVehicle(
        el.dataset.id
      );

    }else if(
      action === "delete-record"
    ){

      await deleteRecord(
        el.dataset.id
      );
    }
  }
);


/* ============================================================
   PHOTO INPUT
============================================================ */

document
  .getElementById(
    "photoInput"
  )
  .addEventListener(
    "change",
    async event => {

      if(
        photoTarget &&
        event.target.files?.length
      ){

        await savePhotos(

          [...event.target.files],

          photoTarget.ownerType,

          photoTarget.ownerId
        );
      }


      event.target.value =
        "";


      photoTarget =
        null;
    }
  );


/* ============================================================
   RESTORE INPUT
============================================================ */

document
  .getElementById(
    "importFile"
  )
  .addEventListener(
    "change",
    async event => {

      const file =
        event.target.files?.[0];


      if(file){

        await restoreBackup(
          file
        );
      }


      event.target.value =
        "";
    }
  );


/* ============================================================
   SERVICE WORKER
============================================================ */

if(
  "serviceWorker" in navigator
){

  window.addEventListener(
    "load",
    () => {

      navigator.serviceWorker
        .register(
          "./sw.js"
        )
        .catch(
          console.error
        );
    }
  );
}


/* ============================================================
   START
============================================================ */

(async function(){

  await openDB();

  await render();

})();
</script>

</body>
</html>
